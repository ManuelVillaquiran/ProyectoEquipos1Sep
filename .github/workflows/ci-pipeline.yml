# Workflow de Integración Continua - Pruebas Unitarias y Build

name: Integración Continua - Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Mensaje de inicio
      run: echo "Iniciando proceso de integración..."

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r principal/requirements.txt

    - name: Ejecutar pruebas unitarias
      run: cd principal && python manage.py test
